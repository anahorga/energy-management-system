http:
  # Define URL routing rules, middlewares, and services
  routers:
    user-api:
      rule: "Host(`localhost`) && PathPrefix(`/api/users`)" # Match requests to localhost with /api prefix
      entryPoints:
        - web # Listen on the web (HTTP) entry point
      service: user-service
      
    device-api:
        rule: "Host(`localhost`) && PathPrefix(`/api/devices`)" # Match requests to localhost with /api prefix
        entryPoints:
          - web # Listen on the web (HTTP) entry point
        service: device-service
        
    authentication-api:
        rule: "Host(`localhost`) && PathPrefix(`/api/auth`)" # Match requests to localhost with /api prefix
        entryPoints:
          - web # Listen on the web (HTTP) entry point
        service: authentication-service

  services:
    user-service:
      loadBalancer:
        servers:
          - url: "http://userservice:8081" # Container name solved by Docker DNS

    device-service:
      loadBalancer:
        servers:
          - url: "http://deviceservice:8082" # Container name solved by Docker DNS
      
    authentication-service:
      loadBalancer:
        servers:
          - url: "http://authenticationservice:8083" # Container name solved by Docker DNS